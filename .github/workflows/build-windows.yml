name: Build Windows installer

# Construit l'installeur Windows (.exe) sur les serveurs de GitHub, pour que
# personne n'ait besoin d'installer Node.js ni de lancer `npm install` sur sa
# propre machine Windows.
#
# - "workflow_dispatch" : lancement manuel depuis l'onglet Actions du depot,
#   le resultat est telechargeable en tant qu'"artifact" (zip) sur la page du
#   run.
# - Pousser un tag "vX.Y.Z" (ex : v1.0.0) : en plus de l'artifact, publie une
#   "Release" GitHub avec l'installeur .exe attache, telechargeable
#   directement depuis la page principale du depot ("Releases" a droite).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        run: npm ci

      - name: Construire l'installeur (electron-builder)
        run: npm run dist

      - name: Mettre l'installeur a disposition (tout lancement)
        uses: actions/upload-artifact@v4
        with:
          name: facturation-windows-installer
          path: release/*.exe

      - name: Publier une Release GitHub (uniquement sur un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
